<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glossary // Amditis Kit</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tools.amditis.tech/glossary/" />
    <meta property="og:title" content="Glossary | Amditis AI journalism tools" />
    <meta property="og:description" content="Key terms for journalists using AI coding tools: context, tokens, hooks, skills, and more." />
    <meta property="og:image" content="https://tools.amditis.tech/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glossary | Amditis AI journalism tools" />
    <meta name="twitter:description" content="Key terms for journalists using AI coding tools: context, tokens, hooks, skills, and more." />
    <meta name="twitter:image" content="https://tools.amditis.tech/assets/og-image.png" />

    <!-- CSS & Config -->
    <link rel="stylesheet" href="/assets/amditis-main.css">
    <link rel="stylesheet" href="/assets/tailwind.css">
    <link rel="stylesheet" href="/assets/amditis-v3.css">
    <script>
        /* Applies the stored day/night paper choice before first paint. */
        (function () {
            try {
                var t = localStorage.getItem('amditis-theme');
                if (t === 'light' || t === 'dark') {
                    document.documentElement.setAttribute('data-theme', t);
                }
            } catch (e) { /* storage blocked: fall back to prefers-color-scheme */ }
        })();
    </script>
    <script src="/assets/theme.js" defer></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@0.577.0/dist/umd/lucide.min.js" integrity="sha384-orgVf2eX2+m1zKAOIi09hD0W6GtVhoOUmqDK+sysYB2JTZ4vS86j4jm+X7a4Nnei" crossorigin="anonymous"></script>
<script src="/assets/ask-ai.js" defer></script>
</head>
<body class="antialiased font-sans bg-canvas text-ink">

    <div class="paper-overlay"></div>
    <div class="fixed top-[-15%] left-[-10%] w-[50%] h-[50%] bg-accent/5 rounded-full blur-[140px] animate-drift pointer-events-none z-0"></div>

    <div class="relative z-10 flex min-h-screen flex-col">

        <!-- Header -->
        <header class="border-b border-ink/10 bg-canvas/50 backdrop-blur-md sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <a href="/" class="w-8 h-8 bg-accent text-white flex items-center justify-center font-bold font-display text-xl hover:bg-ink transition-colors">A</a>
                    <div>
                        <div class="font-display font-bold text-sm tracking-wider text-ink">Database // Glossary</div>
                        <div class="text-xs text-ink/50 tracking-[0.2em]">Terms v2.5</div>
                    </div>
                </div>
                <a href="/downloads/glossary.md" download class="hidden md:flex items-center gap-2 px-3 py-1 border border-ink/20 text-xs text-ink/60 hover:border-accent hover:text-accent transition-colors">
                    <i data-lucide="download" class="w-3 h-3"></i> Download.md
                </a>
            <div data-theme-toggle-slot class="flex items-center"></div>
                </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-7xl mx-auto w-full px-6 py-16">

            <!-- Search Hero -->
            <div class="max-w-2xl mx-auto mb-16 text-center">
                <h2 class="font-display text-4xl font-light italic text-ink mb-4">Knowledge Base</h2>
                <p class="text-ink/50 text-sm mb-8">Plain-english definitions for technical terms. Search or browse below.</p>

                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-ink/40 group-focus-within:text-accent transition-colors">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </div>
                    <input type="text" id="searchInput" class="w-full bg-white border border-ink/10 text-ink pl-12 pr-4 py-4 text-sm focus:outline-none focus:border-accent focus:bg-white transition-all rounded-sm" placeholder="Search terms...">
                    <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                        <span class="text-xs text-ink/30 group-focus-within:text-accent transition-colors">[Input]</span>
                    </div>
                </div>
            </div>

            <!-- Grid -->
            <div id="glossaryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Terms injected here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-20 border border-dashed border-ink/10 bg-white/50 rounded-sm">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-ink/5 mb-4 text-ink/40">
                    <i data-lucide="database" class="w-6 h-6"></i>
                </div>
                <h3 class="font-display text-lg text-ink mb-1">No match found</h3>
                <p class="text-xs text-ink/50">Query returned 0 results. Refine search parameters.</p>
            </div>

        </main>

        <!-- Footer -->
        <footer class="bg-ink text-canvas py-8">
            <div class="max-w-7xl mx-auto px-6 text-center text-xs text-canvas/60">
                <p>System status: Online // <a href="/" class="hover:text-accent transition-colors">Return home</a></p>
            </div>
        </footer>

    </div>

    <!-- Load Data -->
    <script src="/assets/glossary.js"></script>

    <!-- App Logic -->
    <script>
        try { lucide.createIcons(); } catch (e) {}

        const grid = document.getElementById('glossaryGrid');
        const searchInput = document.getElementById('searchInput');
        const emptyState = document.getElementById('emptyState');

        // Convert GLOSSARY object to array
        const terms = Object.keys(GLOSSARY).map(key => ({
            key: key,
            ...GLOSSARY[key]
        })).sort((a, b) => a.term.localeCompare(b.term));

        function renderTerms(filter = '') {
            grid.innerHTML = '';
            const query = filter.toLowerCase();
            let count = 0;

            terms.forEach(item => {
                const match = item.term.toLowerCase().includes(query) ||
                              item.short.toLowerCase().includes(query) ||
                              item.full.toLowerCase().includes(query);

                if (match) {
                    count++;
                    const card = document.createElement('div');
                    card.className = 'deckle-card hover:border-accent transition-colors group relative overflow-hidden flex flex-col h-full';

                    // Header
                    let headerHtml = `
                        <div class="p-6 border-b border-ink/10 bg-ink/[0.02] flex justify-between items-start">
                            <div>
                                <div class="text-xs text-accent mb-1 tracking-widest opacity-0 group-hover:opacity-100 transition-opacity">Term</div>
                                <h3 class="font-display text-xl text-ink font-bold tracking-wide group-hover:text-accent transition-colors">${item.term}</h3>
                            </div>
                            <button onclick="copyDefinition('${item.key}')" class="text-ink/40 hover:text-ink transition-colors" title="Copy data">
                                <i data-lucide="copy" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;

                    // Body
                    let bodyHtml = `
                        <div class="p-6 flex-1 flex flex-col">
                            <div class="mb-4">
                                <span class="inline-block px-2 py-0.5 border border-ink/10 bg-ink/[0.02] text-xs text-ink/60 uppercase tracking-wider">
                                    Synopsis
                                </span>
                                <p class="mt-2 text-sm font-bold text-ink">${item.short}</p>
                            </div>
                            <div class="mt-auto pt-4 border-t border-ink/5">
                                <p class="text-xs text-ink/50 leading-relaxed">${item.full}</p>
                            </div>
                        </div>
                    `;

                    card.innerHTML = headerHtml + bodyHtml;
                    grid.appendChild(card);
                }
            });

            if (count === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            // Re-init icons for new elements
            try { lucide.createIcons(); } catch (e) {}
        }

        function copyDefinition(key) {
            const item = GLOSSARY[key];
            if (!item) return;

            const text = `${item.term}\n\n${item.short}\n\n${item.full}`;
            navigator.clipboard.writeText(text).then(() => {
                // Flash effect could be added here
            });
        }

        // Search listener
        searchInput.addEventListener('input', (e) => {
            renderTerms(e.target.value);
        });

        // Initial render
        renderTerms();
    </script>
</body>
</html>
