<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Advisor | Amditis Kit</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

    <!-- CSS & Config -->
    <link rel="stylesheet" href="/assets/amditis-main.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/amditis-config.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* App Specific Overrides */
        #progress-bar {
            box-shadow: 0 0 8px currentColor;
        }

        .option-button:hover {
            transform: translateX(4px);
        }
    </style>
<script src="/assets/ask-ai.js" defer></script>
</head>
<body class="antialiased font-sans bg-canvas text-ink h-full overflow-hidden">

    <div class="paper-overlay"></div>
    <div class="fixed top-[-15%] left-[-10%] w-[50%] h-[50%] bg-accent/5 rounded-full blur-[140px] animate-drift pointer-events-none z-0"></div>

    <div class="relative z-10 flex h-full">

        <!-- Sidebar (Hidden on Mobile) -->
        <aside class="w-64 border-r border-ink/10 bg-canvas hidden md:flex flex-col z-50">
            <div class="p-6 border-b border-ink/10">
                <a href="/" class="flex items-center gap-3 group">
                    <div class="w-8 h-8 bg-accent text-canvas flex items-center justify-center font-bold font-display text-xl group-hover:bg-ink transition-colors">A</div>
                    <div>
                        <h1 class="font-display font-bold text-lg tracking-wider text-ink">Amditis</h1>
                        <p class="text-xs text-mist tracking-[0.2em]">Kit v2.5</p>
                    </div>
                </a>
            </div>

            <div class="p-6 flex-1">
                <div class="text-xs font-medium text-accent mb-4 uppercase tracking-widest flex items-center gap-2">
                    <i data-lucide="cpu" class="w-3 h-3"></i> System status
                </div>
                <div class="space-y-4 text-xs text-mist">
                    <div class="flex justify-between">
                        <span>Module</span>
                        <span class="text-ink">LLM Advisor</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Version</span>
                        <span class="text-ink">2.1.0</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Mode</span>
                        <span class="text-accent">Interactive</span>
                    </div>
                </div>

                <div class="mt-8 pt-8 border-t border-ink/10">
                    <button id="show-comparison-btn" class="w-full text-left py-2 hover:text-ink hover:pl-2 transition-all border-l-2 border-transparent hover:border-accent text-mist text-xs">
                        Compare Models
                    </button>
                    <button id="show-case-studies-btn" class="w-full text-left py-2 hover:text-ink hover:pl-2 transition-all border-l-2 border-transparent hover:border-accent text-mist text-xs">
                        Case Studies
                    </button>
                </div>
            </div>

            <div class="p-6 border-t border-ink/10 space-y-4">
                <a href="/llm-advisor-doc/" class="flex items-center gap-2 text-xs text-mist hover:text-ink transition-colors">
                    <i data-lucide="file-text" class="w-3 h-3"></i>
                    View Static Docs
                </a>
                <div class="flex flex-wrap gap-2 pt-2">
                    <a href="https://venmo.com/jamditis" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-semibold text-white bg-[#008CFF] hover:opacity-90 transition-opacity">
                        <svg viewBox="0 0 24 24" class="w-3 h-3 fill-current"><path d="M19.5 1.5c.9 1.5 1.3 3 1.3 4.9 0 6.1-5.2 14-9.4 19.6H4.4L1.5 2.1l6.2-.6 1.7 13.4c1.5-2.5 3.4-6.4 3.4-9.1 0-1.8-.3-3-.8-4z"/></svg>
                        Venmo
                    </a>
                    <a href="https://paypal.me/jamditis" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-semibold text-white bg-[#003087] hover:opacity-90 transition-opacity">
                        <svg viewBox="0 0 24 24" class="w-3 h-3 fill-current"><path d="M7.02 21.5L7.8 17h-2L8.6 2.5h5.4c2.6 0 4.4 1.8 4 4.4-.6 3.4-3.2 5.1-6.2 5.1H9.7l-1 5.5H6.6zm10-15.1c.3-2-1-3.4-3.4-3.4h-1L11.4 10h1.2c2.2 0 4-1.2 4.4-3.6zm-1.6 8.1c.3-2-1-3.4-3.4-3.4h-1L9.8 18h1.2c2.2 0 4-1.2 4.4-3.5z"/></svg>
                        PayPal
                    </a>
                    <a href="https://github.com/sponsors/jamditis" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-semibold text-white bg-[#333] hover:opacity-90 transition-opacity">
                        <svg viewBox="0 0 16 16" class="w-3 h-3 fill-current"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                        Sponsor
                    </a>
                </div>
            </div>
        </aside>

        <!-- App Container -->
        <main class="flex-1 flex flex-col h-full relative" id="llm-tool-advisor-container">

            <!-- App Header -->
            <header class="border-b border-ink/10 bg-canvas/80 backdrop-blur-md p-6 flex flex-col gap-4 z-20">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="font-display text-2xl text-ink tracking-wide">Tool Selector</h2>
                        <div id="breadcrumb" class="text-xs text-mist mt-1 hidden"></div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button id="back-btn" class="w-8 h-8 border border-ink/10 flex items-center justify-center text-mist hover:text-ink hover:border-ink transition-colors disabled:opacity-30 disabled:cursor-not-allowed">
                            <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        </button>
                        <button id="restart-btn" class="w-8 h-8 border border-ink/10 flex items-center justify-center text-mist hover:text-accent hover:border-accent transition-colors">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Controls -->
                <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                    <!-- Progress -->
                    <div class="w-full md:w-1/3 bg-clay/50 border border-ink/10 h-2 relative overflow-hidden">
                        <div id="progress-bar" class="absolute top-0 left-0 h-full bg-accent w-0 transition-all duration-500"></div>
                    </div>

                    <!-- Quick Jump -->
                    <div class="w-full md:w-auto relative">
                        <select id="tool-selector" class="appearance-none bg-canvas border border-ink/10 text-xs text-mist py-2 pl-3 pr-8 w-full md:w-64 focus:outline-none focus:border-accent focus:text-accent transition-colors cursor-pointer">
                            <!-- Options injected -->
                        </select>
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-mist">
                            <i data-lucide="chevron-down" class="w-3 h-3"></i>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Main Content Area -->
            <div id="app-container" class="flex-1 overflow-y-auto p-6 md:p-12 relative">
                <div id="main-content" class="max-w-3xl mx-auto transition-opacity duration-300">
                    <!-- Dynamic content injected here -->
                </div>
            </div>

            <!-- Mobile Footer Controls -->
            <div class="md:hidden border-t border-ink/10 bg-ink text-canvas p-4 space-y-3">
                <div class="grid grid-cols-2 gap-4">
                    <button id="footer-best-practices-btn" class="text-xs text-canvas/70 border border-canvas/20 py-2 text-center hover:text-canvas hover:border-canvas/40 transition-colors">Best Practices</button>
                    <button id="footer-model-info-btn" class="text-xs text-canvas/70 border border-canvas/20 py-2 text-center hover:text-canvas hover:border-canvas/40 transition-colors">Model Info</button>
                </div>
                <div class="flex justify-center gap-2 pt-1">
                    <a href="https://venmo.com/jamditis" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-semibold text-white bg-[#008CFF] hover:opacity-90 transition-opacity">
                        <svg viewBox="0 0 24 24" class="w-3 h-3 fill-current"><path d="M19.5 1.5c.9 1.5 1.3 3 1.3 4.9 0 6.1-5.2 14-9.4 19.6H4.4L1.5 2.1l6.2-.6 1.7 13.4c1.5-2.5 3.4-6.4 3.4-9.1 0-1.8-.3-3-.8-4z"/></svg>
                        Venmo
                    </a>
                    <a href="https://paypal.me/jamditis" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-semibold text-white bg-[#003087] hover:opacity-90 transition-opacity">
                        <svg viewBox="0 0 24 24" class="w-3 h-3 fill-current"><path d="M7.02 21.5L7.8 17h-2L8.6 2.5h5.4c2.6 0 4.4 1.8 4 4.4-.6 3.4-3.2 5.1-6.2 5.1H9.7l-1 5.5H6.6zm10-15.1c.3-2-1-3.4-3.4-3.4h-1L11.4 10h1.2c2.2 0 4-1.2 4.4-3.6zm-1.6 8.1c.3-2-1-3.4-3.4-3.4h-1L9.8 18h1.2c2.2 0 4-1.2 4.4-3.5z"/></svg>
                        PayPal
                    </a>
                    <a href="https://github.com/sponsors/jamditis" target="_blank" rel="noopener" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-[11px] font-semibold text-white bg-canvas/20 hover:bg-canvas/30 transition-colors">
                        <svg viewBox="0 0 16 16" class="w-3 h-3 fill-current"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
                        Sponsor
                    </a>
                </div>
            </div>

        </main>

    </div>

    <!-- Universal Modal -->
    <div id="universal-modal" class="fixed inset-0 z-[100] bg-ink/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div id="modal-content-container" class="deckle-card w-full max-w-4xl max-h-[85vh] flex flex-col shadow-2xl relative">
            <div class="flex justify-between items-center p-6 border-b border-ink/10 bg-clay/30">
                <h3 id="modal-title" class="font-display text-xl text-ink">Modal Title</h3>
                <button class="modal-close-btn text-mist hover:text-ink transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto text-sm text-mist leading-relaxed">
                <!-- Modal content -->
            </div>
        </div>
    </div>

    <!-- Hidden elements required by app.js logic but not needed in UI -->
    <input type="checkbox" id="theme-toggle-checkbox" class="hidden">
    <button id="show-changelog-btn" class="hidden"></button>

    <!-- App Logic -->
    <script src="app.js"></script>
    <script>
        // Init Icons
        lucide.createIcons();

        // Additional UI logic if needed
        const observer = new MutationObserver(() => {
            lucide.createIcons();
        });
        observer.observe(document.getElementById('main-content'), { childList: true, subtree: true });
    </script>

</body>
</html>
