<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Engineering Glossary | Amditis Kit</title>
    <meta name="description" content="From hydration to CRDT — the deep vocabulary of modern frontend development.">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tools.amditis.tech/vibe-coding/glossary-frontend/" />
    <meta property="og:title" content="Frontend glossary | Amditis vibe coding guide" />
    <meta property="og:description" content="Key frontend development terms for journalists building with AI assistance." />
    <meta property="og:image" content="https://tools.amditis.tech/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Frontend glossary | Amditis vibe coding guide" />
    <meta name="twitter:description" content="Key frontend development terms for journalists building with AI assistance." />
    <meta name="twitter:image" content="https://tools.amditis.tech/assets/og-image.png" />
    <link rel="stylesheet" href="/assets/amditis-main.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/amditis-config.js"></script>
    <script defer src="https://unpkg.com/lucide@0.577.0/dist/umd/lucide.min.js" integrity="sha384-orgVf2eX2+m1zKAOIi09hD0W6GtVhoOUmqDK+sysYB2JTZ4vS86j4jm+X7a4Nnei" crossorigin="anonymous"></script>
    <style>
        .term-card {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .term-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
            border-color: var(--accent) !important;
        }
        .term-card:hover .term-name {
            color: var(--accent);
        }
        .cat-tab {
            transition: all 0.18s ease;
            white-space: nowrap;
        }
        .cat-tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .cat-tab:not(.active):hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        #search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(61,75,64,0.12);
        }
        .term-hidden { display: none; }
        .highlight {
            background: rgba(61,75,64,0.15);
            border-radius: 2px;
            padding: 0 1px;
        }
        @media (max-width: 640px) {
            .tab-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        }
    </style>
</head>
<body class="antialiased font-sans bg-canvas text-ink">

<div class="paper-overlay"></div>
<div class="fixed top-[-15%] right-[-10%] w-[50%] h-[50%] bg-accent/5 rounded-full blur-[140px] pointer-events-none z-0"></div>

<div class="relative z-10 flex min-h-screen flex-col">

    <!-- Header -->
    <header class="border-b border-ink/10 bg-canvas/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <a href="/" class="w-8 h-8 bg-accent text-white flex items-center justify-center font-bold font-display text-xl rounded hover:bg-ink transition-colors">A</a>
                <div>
                    <div class="font-display font-bold text-sm tracking-wider text-ink">Frontend glossary</div>
                    <div class="text-xs text-ink/50 tracking-wide">Modern web engineering</div>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="/vibe-coding/glossary-database/" class="hidden md:flex items-center gap-2 px-3 py-1 border border-ink/20 text-xs text-ink/60 hover:border-accent hover:text-accent transition-colors rounded">
                    ← Database terms
                </a>
                <a href="/vibe-coding/" class="flex items-center gap-2 px-3 py-1 border border-ink/20 text-xs text-ink/60 hover:border-accent hover:text-accent transition-colors rounded">
                    <i data-lucide="arrow-left" class="w-3 h-3"></i> Back
                </a>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="border-b border-ink/10 py-14 px-6 relative overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[260px] bg-accent/5 blur-[100px] rounded-full pointer-events-none"></div>
        <div class="max-w-4xl mx-auto relative z-10 text-center">
            <div class="inline-flex items-center gap-2 px-3 py-1 border border-accent/30 bg-accent/5 text-accent text-xs font-medium tracking-wide rounded-full mb-6">
                <i data-lucide="zap" class="w-3 h-3"></i>
                <span id="term-count-badge">88 terms</span>
            </div>
            <h1 class="font-display text-4xl sm:text-5xl font-light italic mb-4 text-ink">Frontend engineering concepts</h1>
            <p class="text-ink/60 text-lg max-w-2xl mx-auto mb-8 leading-relaxed">
                From hydration to CRDT — the deep vocabulary of<br class="hidden sm:inline"> modern browser, framework, and web platform engineering.
            </p>

            <!-- Search -->
            <div class="max-w-xl mx-auto relative">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-ink/40 pointer-events-none"></i>
                <input
                    id="search-input"
                    type="text"
                    placeholder="Search terms…"
                    class="w-full pl-11 pr-4 py-3 border border-ink/20 bg-white/60 backdrop-blur-sm rounded text-sm text-ink placeholder-ink/40 transition-all"
                >
                <span id="search-count" class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-ink/40 hidden"></span>
            </div>
        </div>
    </section>

    <!-- Main -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-6 py-10">

        <!-- Category tabs -->
        <div class="tab-scroll flex gap-2 mb-8 pb-2" id="cat-tabs">
            <button class="cat-tab active px-4 py-1.5 border border-ink/20 rounded text-xs font-medium" data-cat="all">All</button>
        </div>

        <!-- Stats row -->
        <div class="flex items-center justify-between mb-6">
            <p id="results-label" class="text-xs text-ink/50"></p>
            <div class="flex gap-3 text-xs text-ink/40">
                <span id="visible-count"></span>
            </div>
        </div>

        <!-- Grid -->
        <div id="terms-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- populated by JS -->
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="hidden text-center py-20">
            <i data-lucide="search-x" class="w-10 h-10 text-ink/20 mx-auto mb-4"></i>
            <p class="text-ink/50 text-sm">No terms match your search.</p>
            <button onclick="clearSearch()" class="mt-3 text-accent text-xs underline">Clear search</button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-ink/10 py-6 px-6 text-center text-xs text-ink/40">
        <p>Amditis Resource Kit · <a href="/vibe-coding/" class="hover:text-accent transition-colors">Vibe Coding Guide</a></p>
    </footer>

</div>

<script src="./data.js"></script>
<script>
(function() {
    const tabContainer = document.getElementById('cat-tabs');
    GLOSSARY_META.categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-tab px-4 py-1.5 border border-ink/20 rounded text-xs font-medium';
        btn.dataset.cat = cat.id;
        btn.textContent = cat.label;
        tabContainer.appendChild(btn);
    });

    const grid = document.getElementById('terms-grid');
    const catColors = {};
    GLOSSARY_META.categories.forEach(c => { catColors[c.id] = c.label; });

    function termCard(term) {
        const card = document.createElement('a');
        card.href = `./term.html?t=${term.id}`;
        card.className = 'term-card deckle-card block p-5 border border-ink/10 rounded';
        card.dataset.cat = term.category;
        card.dataset.term = (term.term + ' ' + term.tagline).toLowerCase();

        const catLabel = catColors[term.category] || term.category;
        const svgThumb = term.svg
            ? `<div class="w-14 h-14 flex-shrink-0 opacity-60 hover:opacity-100 transition-opacity">${term.svg}</div>`
            : '';
        card.innerHTML = `
            <div class="flex items-start justify-between gap-2 mb-3">
                <span class="term-name font-display text-base font-light italic text-ink leading-tight transition-colors flex-1">${term.term}</span>
                ${svgThumb || '<i data-lucide="arrow-up-right" class="w-3.5 h-3.5 text-ink/30 flex-shrink-0 mt-0.5"></i>'}
            </div>
            <p class="text-xs text-ink/60 leading-relaxed mb-4">${term.tagline}</p>
            <span class="inline-block px-2 py-0.5 bg-accent/10 text-accent border border-accent/20 rounded text-[10px] font-medium">${catLabel}</span>
        `;
        return card;
    }

    TERMS.forEach(t => grid.appendChild(termCard(t)));

    document.getElementById('term-count-badge').textContent = `${TERMS.length} Terms`;
    lucide.createIcons();

    let activeCategory = 'all';
    let searchQuery = '';

    function applyFilters() {
        const cards = grid.querySelectorAll('a.term-card');
        let visible = 0;

        cards.forEach(card => {
            const matchesCat = activeCategory === 'all' || card.dataset.cat === activeCategory;
            const matchesSearch = !searchQuery || card.dataset.term.includes(searchQuery.toLowerCase());

            if (matchesCat && matchesSearch) {
                card.classList.remove('term-hidden');
                visible++;
                const nameEl = card.querySelector('.term-name');
                if (searchQuery) {
                    const raw = nameEl.textContent;
                    const idx = raw.toLowerCase().indexOf(searchQuery.toLowerCase());
                    if (idx >= 0) {
                        nameEl.innerHTML = raw.slice(0, idx)
                            + `<mark class="highlight">${raw.slice(idx, idx + searchQuery.length)}</mark>`
                            + raw.slice(idx + searchQuery.length);
                    }
                } else {
                    const term = TERMS.find(t => t.id === card.href.split('?t=')[1]);
                    if (term) nameEl.textContent = term.term;
                }
            } else {
                card.classList.add('term-hidden');
            }
        });

        document.getElementById('empty-state').classList.toggle('hidden', visible > 0);
        document.getElementById('visible-count').textContent = `${visible} of ${TERMS.length} terms`;
        document.getElementById('results-label').textContent = searchQuery
            ? `Results for "${searchQuery}"`
            : activeCategory !== 'all'
                ? `Showing: ${catColors[activeCategory] || activeCategory}`
                : '';
    }

    tabContainer.addEventListener('click', e => {
        const btn = e.target.closest('.cat-tab');
        if (!btn) return;
        tabContainer.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        applyFilters();
    });

    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', e => {
        searchQuery = e.target.value.trim();
        applyFilters();
    });

    window.clearSearch = function() {
        searchInput.value = '';
        searchQuery = '';
        applyFilters();
    };

    applyFilters();

    document.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement !== searchInput) {
            e.preventDefault();
            searchInput.focus();
        }
    });
})();
</script>
</body>
</html>
